name: Build Yantra Pro APK (Fixed v2)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Fix broken gradle.properties (remove local java.home)
        run: |
          echo "=== BEFORE ==="
          cat gradle.properties || echo "no root gradle.properties"
          # Lösche die Zeile mit dem lokalen Pfad /home/gtm/...
          sed -i '/org.gradle.java.home/d' gradle.properties || true
          sed -i '/java.home/d' gradle.properties || true
          # Falls es auch im .gradle Ordner liegt
          if [ -f ~/.gradle/gradle.properties ]; then
            sed -i '/org.gradle.java.home/d' ~/.gradle/gradle.properties || true
          fi
          echo "=== AFTER ==="
          cat gradle.properties || echo "no root gradle.properties"

      - name: Create local.properties
        run: |
          echo "weatherAPIkey=\"dummy-key\"" > local.properties
          echo "backupPassword=\"dummy-password\"" >> local.properties
          echo "crashReportEndpoint=\"https://example.com/crash\"" >> local.properties
          echo "crashApiKey=\"dummy\"" >> local.properties

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Build Pro Debug APK
        run: ./gradlew assembleProDebug --stacktrace -Dorg.gradle.java.home=$JAVA_HOME

      - name: Build Pro Release APK
        run: ./gradlew assembleProRelease --stacktrace -Dorg.gradle.java.home=$JAVA_HOME

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: yantra-pro-debug-apk
          path: app/build/outputs/apk/pro/debug/*.apk
          if-no-files-found: error

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: yantra-pro-release-apk
          path: app/build/outputs/apk/pro/release/*.apk
          if-no-files-found: error
