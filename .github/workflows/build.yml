name: Build Yantra Pro APK (Fixed)

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v3

      - name: Create local.properties
        run: |
          echo "weatherAPIkey=\"dummy-key\"" > local.properties
          echo "backupPassword=\"dummy-password\"" >> local.properties
          echo "crashReportEndpoint=\"https://example.com/crash\"" >> local.properties
          echo "crashApiKey=\"dummy\"" >> local.properties
          cat local.properties

      - name: Make gradlew executable
        run: chmod +x ./gradlew

      - name: Accept Android licenses
        run: yes | sdkmanager --licenses || true

      - name: Build Pro Debug APK
        run: ./gradlew assembleProDebug --stacktrace

      - name: Build Pro Release APK
        run: ./gradlew assembleProRelease --stacktrace

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: yantra-pro-debug-apk
          path: app/build/outputs/apk/pro/debug/*.apk
          if-no-files-found: error

      - name: Upload Release APK
        uses: actions/upload-artifact@v4
        with:
          name: yantra-pro-release-apk
          path: app/build/outputs/apk/pro/release/*.apk
          if-no-files-found: error
